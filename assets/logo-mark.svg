  <!-- nozzle -->
  <rect x="44.5" y="63" width="11" height="4" rx="1" fill="#26405E"/>
  <!-- sparkles -->
  <g fill="#6DA6C1">
    <path d="M80 22 l1.6 4.4 4.4 1.6 -4.4 1.6 -1.6 4.4 -1.6 -4.4 -4.4 -1.6 4.4 -1.6 Z"/>
    <circle cx="21" cy="32" r="1.8"/>
    <circle cx="86" cy="44" r="1.4"/>
    <circle cx="26" cy="20" r="1.2"/>
  </g>
