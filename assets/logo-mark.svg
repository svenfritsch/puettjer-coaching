  <path d="M50 10 C55 15 57.6 21.5 58.6 28 L41.4 28 C42.4 21.5 45 15 50 10 Z" fill="#E0574A" stroke="#26405E" stroke-width="2" stroke-linejoin="round"/>
  <!-- window -->
