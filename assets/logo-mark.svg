<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Püttjer &amp; Püttjer">
  <!-- cloud -->
  <g fill="#A7DFE5">
    <circle cx="27" cy="67" r="11"/>
    <circle cx="40" cy="58" r="14"/>
    <circle cx="61" cy="57" r="13"/>
    <circle cx="75" cy="66" r="11"/>
    <rect x="16" y="64" width="70" height="14" rx="7"/>
  </g>
  <!-- flame -->
  <path d="M43.5 66 Q50 92 56.5 66 Z" fill="#EFAC35"/>
  <path d="M46.5 66 Q50 80 53.5 66 Z" fill="#FFD66B"/>
  <!-- fins -->
  <path d="M41 46 L31 60 L31 68 L41 62 Z" fill="#EFAC35" stroke="#26405E" stroke-width="2" stroke-linejoin="round"/>
  <path d="M59 46 L69 60 L69 68 L59 62 Z" fill="#EFAC35" stroke="#26405E" stroke-width="2" stroke-linejoin="round"/>
  <!-- body -->
  <path d="M50 10 C57 17 59.5 27 59.5 36 L59.5 63 L40.5 63 L40.5 36 C40.5 27 43 17 50 10 Z" fill="#FFFFFF" stroke="#26405E" stroke-width="2" stroke-linejoin="round"/>
